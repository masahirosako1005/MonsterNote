# MonsterNote の部品の間の知らせ（共通の約束の置き場。contract-summary C12〜C14・C16 2.4）。
# 届け方: EventBridge の独自のバス monsternote-dev。source は monsternote.<部品の名前>、detail-type は知らせの種類、
# detail は EventEnvelope（reliability-design）。受け手は eventId で 2 回目を無視する。
# U2 での変更: report.saved・review.status-changed の受け手に DuplicateDetection を足した（ADR-003）。
# duplicate.suspected（C14）を新規に足した。manualEntry は U2 で実際に true になりうる（BR2.12）。
asyncapi: 2.6.0
info:
  title: MonsterNote events
  version: v1
defaultContentType: application/json
channels:
  report.saved:
    description: >
      C12 報告が保存された（送り手 Reporting = source monsternote.reporting）。
      受け手は Review・ReportCatalog（U1）に加え、U2 で DuplicateDetection（保存後の重複の再判定。ADR-003）
    subscribe:
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/EventEnvelope'
            - type: object
              properties:
                data:
                  type: object
                  required:
                    [
                      reportId,
                      hunterAccountId,
                      hunterName,
                      species,
                      capturedAt,
                      location,
                      manualEntry,
                      submittedAt,
                    ]
                  properties:
                    reportId: { type: string }
                    hunterAccountId: { type: string }
                    hunterName: { type: string }
                    species: { type: string, enum: [bear, boar, deer] }
                    capturedAt: { type: string, format: date-time }
                    location:
                      type: object
                      properties:
                        lat: { type: number }
                        lng: { type: number }
                    placeName: { type: string, description: U1・U2 とも空（D-2） }
                    manualEntry:
                      {
                        type: boolean,
                        description: 日時か場所のどちらかが手入力なら true（U2 で実際に使う。BR2.12）,
                      }
                    submittedAt: { type: string, format: date-time }
                    bodyPhotoId: { type: string }
                    photoHash:
                      {
                        type: string,
                        description: Should（写真の重複）。U2 では値を入れない（D-3）,
                      }
  review.status-changed:
    description: >
      C13 報告の状態が変わった（送り手 Review = source monsternote.review）。
      受け手は ReportCatalog（U1）に加え、U2 で DuplicateDetection（却下・取り消しで索引の active を出し入れ。BR8.7・BR8.11）
    subscribe:
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/EventEnvelope'
            - type: object
              properties:
                data:
                  type: object
                  required: [reportId, status, previousStatus, changedAt]
                  properties:
                    reportId: { type: string }
                    status: { type: string, enum: [checking, approved, rejected] }
                    previousStatus: { type: string, enum: [none, checking, approved, rejected] }
                    reason:
                      { type: string, enum: [duplicate, insufficient-photo, out-of-scope, other] }
                    undone: { type: boolean }
                    changedAt: { type: string, format: date-time }
  duplicate.suspected:
    description: >
      C14（U2・新規）。重複の疑いが付いた（送り手 DuplicateDetection = source monsternote.duplicatedetection）。
      保存のあとの判定（report.saved を受けたとき）でだけ送る。送信の前の問い合わせ（C9）では、まだ reportId が
      ないため送らない。疑いの組（報告 A と B）ごとに、reportId が A のものと B のものの 2 つを送る（BR8.4・BR8.6）
    subscribe:
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/EventEnvelope'
            - type: object
              properties:
                data:
                  type: object
                  required: [reportId, matchedReportId, kind]
                  properties:
                    reportId:
                      {
                        type: string,
                        description: 印を付ける報告（この知らせの受け手から見た自分）,
                      }
                    matchedReportId: { type: string, description: 疑いの相手の報告 }
                    kind:
                      {
                        type: string,
                        enum: [place-time, photo, moon-ring],
                        description: U2 は place-time だけ（Q1）,
                      }
components:
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, type, version, occurredAt, source, data]
      properties:
        eventId: { type: string, format: uuid, description: 受け手はこれで 2 回目を無視する }
        type: { type: string, example: report.saved }
        version: { type: integer, minimum: 1 }
        occurredAt:
          {
            type: string,
            format: date-time,
            description: 受け手は新しいものだけを反映する（contract-summary 2.5）,
          }
        actorAccountId: { type: string }
        source:
          type: string
          enum:
            [
              Accounts,
              Reporting,
              SpeciesDetection,
              DuplicateDetection,
              Review,
              ReportCatalog,
              Settings,
            ]
        data: { type: object }
