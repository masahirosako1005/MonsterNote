# MonsterNote の画面向けの API（共通の約束の置き場。contract-summary C1〜C4・C16）。
# U1 で作った道と項目を書く。持ち主の Unit が足していく（contract-summary 6: 足すだけの変更はいつでもよい）。
# U1 での変更: C2 POST /v1/photos の応答に uploadFields を足した（署名付きの POST）。capturedAt・location の source に device を足した。
# U2 での変更（functional-spec.md「7. 約束との違い」D-1〜D-7）:
#   - POST /v1/photos: 受け付ける形式を image/jpeg だけにした（D-4。端末で縮小してから送る）
#   - POST /v1/photos/{photoId}/complete: 全身の写真（kind=body）は種類の判別の結果を応答に含める（BR6.2）
#   - POST /v1/reports: 尻尾の写真・capturedAt・capturedAtSource・locationSource・ageClass・captureMethod を必須にし、
#     chestPhotoMissing・confirmedNotDuplicate を足した。Source から device を外した（exif・manual だけ）。
#     422 の理由に「写真の期限切れ」（D-5）を、409 に DUPLICATE_SUSPECTED（BR7.1）を足した
#   - GET /v1/report-settings（新規。ADR-010）・GET /v1/duplicates/{reportId}（新規。C5・BR8.9）を足した
#   - GET /v1/reports/{reportId} の応答に重複の疑いの印は持たせない（D-7。疑いは C5 で、一覧の印は C14 で届く）
# U3 での変更（D-1〜D-6。functional-spec.md §7）: 却下（decision=rejected・reason・reasonText）と
# POST /v1/reviews/{reportId}/decision/undo を足した。Review に reason・reasonText・undoUntil、ListPage の
# 行に location（D-2）・daysSinceSubmitted・waitingOverSevenDays（BR4.9）を足した。GET /v1/catalog/reports に
# status・flag の絞り込みと、全件数の totalCountHasMore（D-1）を足した。decidedByName は利用者の ID の形を
# 「依頼元の担当者」に置き換えて返す（D-4）。
openapi: 3.0.3
info:
  title: MonsterNote API
  version: v1
servers:
  - url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com
    variables:
      apiId: { default: example }
security:
  - bearerAuth: []
paths:
  /v1/session:
    post:
      tags: [Accounts]
      summary: ログイン（US1.1、BR1.1）。Bearer は付けない
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 証明（1 時間）と出し直し用の値（最後の利用から 30 日）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Accounts]
      summary: ログアウト。出し直し用の値も使えなくする（BR1.3）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: ログアウトした }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/session/refresh:
    post:
      tags: [Accounts]
      summary: 証明の出し直し（BR1.5）。Bearer は付けない
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新しい証明。出し直し用の値は更新される（rotation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/photos:
    post:
      tags: [Reporting]
      summary: 写真のアップロードの準備（ハンター。BR2.2・D-4）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, sizeBytes]
              properties:
                kind: { type: string, enum: [body, tail, chest] }
                contentType:
                  type: string
                  enum: [image/jpeg]
                  description: U2（D-4）端末で JPEG に縮小してから送るため、サーバーは JPEG だけを受け付ける
                sizeBytes: { type: integer, minimum: 1, maximum: 15728640 }
                exifCapturedAt:
                  type: string
                  format: date-time
                  description: U2（BR2.10）。画面が縮小の前に読み取った撮影日時。無ければ空
                exifLocation:
                  allOf: [{ $ref: '#/components/schemas/GeoPoint' }]
                  description: U2（BR2.10）。同上の撮影位置
      responses:
        '201':
          description: 写真の ID と、署名付きの POST の URL と項目（期限 5 分）
          content:
            application/json:
              schema:
                type: object
                required: [photoId, uploadUrl, uploadFields, expiresInSeconds]
                properties:
                  photoId: { type: string }
                  uploadUrl: { type: string, format: uri }
                  uploadFields:
                    type: object
                    additionalProperties: { type: string }
                    description: 署名付きの POST の項目（U1 で足した。infrastructure-specification 5）
                  expiresInSeconds: { type: integer, example: 300 }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/photos/{photoId}/complete:
    post:
      tags: [Reporting]
      summary: アップロードの完了の知らせ（BR2.9。実物の大きさと形式を確かめる。全身の写真は判別する。BR6.2）
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: アップロード済み。全身の写真（kind=body）は判別の結果を含む（U2・BR6.2〜BR6.4）
          content:
            application/json:
              schema:
                type: object
                required: [photoId, uploadStatus]
                properties:
                  photoId: { type: string }
                  uploadStatus: { type: string, enum: [uploaded] }
                  detection: { $ref: '#/components/schemas/DetectionResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/reports:
    post:
      tags: [Reporting]
      summary: 報告の送信（ハンター。BR2.1〜BR2.7・BR2.11〜BR2.20・BR7.1・BR7.2）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  submissionKey,
                  photos,
                  capturedAt,
                  capturedAtSource,
                  location,
                  locationSource,
                  species,
                  sex,
                  ageClass,
                  captureMethod,
                ]
              properties:
                submissionKey: { type: string, minLength: 8, maxLength: 128 }
                photos:
                  type: object
                  required: [body, tail]
                  properties:
                    body: { type: string }
                    tail: { type: string }
                    chest: { type: string, description: クマで撮れたときだけ（BR2.17・BR2.18） }
                capturedAt: { type: string, format: date-time }
                capturedAtSource: { $ref: '#/components/schemas/Source' }
                location: { $ref: '#/components/schemas/GeoPoint' }
                locationSource: { $ref: '#/components/schemas/Source' }
                species: { $ref: '#/components/schemas/Species' }
                sex: { type: string, enum: [male, female, unknown] }
                ageClass: { $ref: '#/components/schemas/AgeClass' }
                captureMethod: { $ref: '#/components/schemas/CaptureMethod' }
                chestPhotoMissing:
                  type: boolean
                  description: species=bear で胸の写真を撮らなかったとき true（BR2.17）
                confirmedNotDuplicate:
                  type: boolean
                  description: 送信前の重複の知らせで「別の個体なので送る」を選んだあとの送り直し（BR7.2）
      responses:
        '201':
          description: 保存した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportId' }
        '200':
          description: 同じ submissionKey ですでに保存済み（同じ reportId）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportId' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: >
            SUBMISSION_IN_PROGRESS（処理中。2 秒後に送り直す）、または U2 の DUPLICATE_SUSPECTED
            （近くで同じ種類・時期の報告がある。BR7.1。conflict.matches に相手の種類・捕獲日時・
            おおよその距離だけを返す。氏名・写真は返さない。BR7.3）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 業務の決まりに合わない（7 日より前・未来・対象地域の外・写真の期限切れ（D-5）・同意していない）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/report-settings:
    get:
      tags: [Reporting]
      summary: U2（新規）。報告の作成に必要な設定（対象地域）。ハンター（ADR-010）
      responses:
        '200':
          description: 対象地域（四角い範囲）
          content:
            application/json:
              schema:
                type: object
                required: [targetArea]
                properties:
                  targetArea: { $ref: '#/components/schemas/TargetArea' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/duplicates/{reportId}:
    get:
      tags: [DuplicateDetection]
      summary: U2（新規）。重複の疑いの相手の一覧（依頼元だけ。BR8.9・C5）
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 疑いの一覧（相手の reportId・距離・時間差・相手の状態。D-6・BR8.8）
          content:
            application/json:
              schema:
                type: object
                required: [reportId, matches]
                properties:
                  reportId: { type: string }
                  matches:
                    type: array
                    items: { $ref: '#/components/schemas/DuplicateMatch' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/reports/{reportId}:
    get:
      tags: [Reporting]
      summary: 報告の詳細と写真の表示用 URL（15 分）。ハンターは自分の報告だけ（BR2.8・BR6.1）
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/reviews/{reportId}:
    get:
      tags: [Review]
      summary: 報告の状態と確認した人。ハンターは自分の報告だけ（BR3.5）。D-4・D-5（U3）
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 状態（undoUntil は本人かつ期限内のときだけ。D-5）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/reviews/{reportId}/decision:
    put:
      tags: [Review]
      summary: 承認・却下（依頼元。確認中のときだけ。U3 で却下（rejected）を追加。BR3.2〜BR3.9）
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason:
                  type: string
                  enum: [duplicate, insufficient-photo, out-of-scope, other]
                  description: decision=rejected のとき必須（BR3.8）
                reasonText:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: reason=other のとき必須。1〜200 文字（D-3）
      responses:
        '200':
          description: 承認・却下した（同じ依頼元の送り直しも 200。undoUntil を含む）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/reviews/{reportId}/decision/undo:
    post:
      tags: [Review]
      summary: 取り消し（依頼元。確定から 10 秒以内・本人だけ。U3・BR3.9〜BR3.11）
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 確認中に戻した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: ALREADY_UNDONE（すでに確認中に戻っている。D-6）または UNDO_EXPIRED（期限切れ）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/catalog/reports:
    get:
      tags: [ReportCatalog]
      summary: すべての報告の一覧（依頼元。新しい順・50 件。絞り込み可。BR4.2・BR4.4・BR4.5）
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          description: カンマ区切りで複数指定可（いずれか）。U3・BR4.5
          schema: { type: string, example: 'checking,approved' }
        - name: flag
          in: query
          required: false
          description: カンマ区切りで複数指定可（いずれか）。duplicate・manual。U3・BR4.5
          schema: { type: string, example: duplicate }
      responses:
        '200':
          description: 行と次のページの位置と全件数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/catalog/my-reports:
    get:
      tags: [ReportCatalog]
      summary: 自分の報告の一覧（ハンター。新しい順・50 件。絞り込みは持たない。BR4.3・BR4.4）
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: 行と次のページの位置と全件数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Accounts が発行した ID トークン（sub・cognito:groups・name）
  responses:
    Error:
      description: 共通のエラーの形（contract-summary 2.2）。応答のヘッダー x-request-id が問い合わせ番号
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
        conflict:
          type: object
          description: 409 の詳細（ALREADY_DECIDED は decision・decidedByName・decidedAt、SUBMISSION_IN_PROGRESS は retryAfterSeconds）
    Account:
      type: object
      required: [accountId, role, displayName]
      properties:
        accountId: { type: string }
        role: { type: string, enum: [hunter, requester, admin] }
        displayName: { type: string }
        organization: { type: string, enum: [municipality, hunters-association] }
    TokenResponse:
      type: object
      required: [idToken, accessToken, refreshToken, expiresIn, account]
      properties:
        idToken: { type: string }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 3600 }
        account: { $ref: '#/components/schemas/Account' }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [mustChangePassword, consentRequired, hunterNumberRequired]
          properties:
            mustChangePassword: { type: boolean }
            consentRequired: { type: boolean }
            hunterNumberRequired: { type: boolean }
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Species:
      type: string
      enum: [bear, boar, deer]
    Source:
      type: string
      enum: [exif, manual]
      description: >
        日時と場所の出どころ。U1 は device だけを使っていたが、U2 で exif・manual に変えた
        （U1 の device は使わなくなった。entities.md）
    AgeClass:
      type: string
      enum: [adult, juvenile]
      description: U2（新規）
    CaptureMethod:
      type: string
      enum: [trap, gun, other]
      description: U2（新規）
    DetectionResult:
      type: object
      description: U2（新規）。種類の自動判別の結果（BR6.1）。全身の写真（kind=body）だけが持つ
      required: [outcome]
      properties:
        outcome: { type: string, enum: [detected, undetected] }
        species: { $ref: '#/components/schemas/Species' }
        confidence:
          { type: number, minimum: 0, maximum: 100, description: 百分率（outcome=detected のとき） }
    TargetArea:
      type: object
      description: U2（新規）。対象地域（四角い範囲。D-1）
      required: [north, south, east, west]
      properties:
        north: { type: number, minimum: -90, maximum: 90 }
        south: { type: number, minimum: -90, maximum: 90 }
        east: { type: number, minimum: -180, maximum: 180 }
        west: { type: number, minimum: -180, maximum: 180 }
    DuplicateMatch:
      type: object
      description: U2（新規）。重複の疑いの相手 1 件（D-6）。氏名・写真・reportId は持たない
      required: [matchedReportId, kind, matchedStatus]
      properties:
        matchedReportId: { type: string }
        kind: { type: string, enum: [place-time, photo, moon-ring] }
        distanceMeters: { type: integer, minimum: 0, description: 100 m 単位（BR7.3） }
        hoursApart: { type: number, minimum: 0 }
        matchedStatus:
          type: string
          enum: [checking, approved, rejected]
          description: 相手の報告の状態（却下も含む。BR8.8・Q7）
    ReportId:
      type: object
      required: [reportId]
      properties:
        reportId: { type: string }
    ReportDetail:
      type: object
      description: >
        D-7: 重複の疑いの印は持たない。疑いは C5 GET /v1/duplicates/{reportId} で、
        一覧の印は C14 の知らせ（duplicateSuspected）で届く
      properties:
        reportId: { type: string }
        hunterAccountId: { type: string }
        hunterNumber: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        sex: { type: string, enum: [male, female, unknown] }
        ageClass: { $ref: '#/components/schemas/AgeClass' }
        captureMethod: { $ref: '#/components/schemas/CaptureMethod' }
        capturedAt: { type: string, format: date-time }
        capturedAtSource: { $ref: '#/components/schemas/Source' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        locationSource: { $ref: '#/components/schemas/Source' }
        submittedAt: { type: string, format: date-time }
        photos:
          type: array
          description: U2 で全身・尻尾（必須）・胸（クマで撮れたとき）の最大 3 枚になる
          items:
            type: object
            properties:
              photoId: { type: string }
              kind: { type: string, enum: [body, tail, chest] }
              url: { type: string, format: uri }
              expiresInSeconds: { type: integer, example: 900 }
    Review:
      type: object
      required: [reportId, status]
      properties:
        reportId: { type: string }
        status: { type: string, enum: [checking, approved, rejected] }
        decidedByName:
          type: string
          description: 利用者の ID の形に見えるときは「依頼元の担当者」に置き換えて返す（D-4）
        decidedAt: { type: string, format: date-time }
        reason:
          type: string
          enum: [duplicate, insufficient-photo, out-of-scope, other]
          description: status=rejected のときだけ（BR3.14。U3）
        reasonText:
          type: string
          description: reason=other のときだけ（U3）
        undoUntil:
          type: string
          format: date-time
          description: 本人が読んだとき、かつ今の時刻以前のときだけ返す（BR3.15。D-5。U3）
    ListPage:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              reportId: { type: string }
              hunterName: { type: string }
              species: { $ref: '#/components/schemas/Species' }
              capturedAt: { type: string, format: date-time }
              placeName: { type: string, nullable: true }
              location:
                description: placeName が空のときだけ返す（D-2）
                allOf: [{ $ref: '#/components/schemas/GeoPoint' }]
              status: { type: string, enum: [checking, approved, rejected] }
              duplicateSuspected: { type: boolean }
              manualEntry: { type: boolean }
              submittedAt: { type: string, format: date-time }
              daysSinceSubmitted:
                type: integer
                description: status=checking の行だけ。24 時間を 1 日として切り捨て（BR4.9。U3）
              waitingOverSevenDays:
                type: boolean
                description: status=checking かつ経過が 7 日を超えたときだけ true（BR4.9。U3）
        nextCursor:
          type: string
          nullable: true
          description: 前のページの最後の行を表す、画面が中身を読まない文字列。最後のページは null（BR4.4）
        totalCount: { type: integer }
        totalCountHasMore:
          type: boolean
          description: >-
            絞り込みの読む上限（2,000 件）に達した、または読み出し中の一時的な失敗で打ち切ったときだけ true
            （totalCount はそこまでの件数。画面は「2,000 件以上」と表示する。D-1・BR4.8）
